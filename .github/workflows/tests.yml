name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          cd backend
          pip install -r requirements.txt

      - run: |
          cd backend
          python -c "from app.main import app; print('Backend OK')"
