version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: cinematch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cinematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinematch123}
      POSTGRES_DB: ${POSTGRES_DB:-cinematch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinematch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinematch_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cinematch:cinematch123@db:5432/cinematch
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_change_in_production}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ml_models:/app/ml_models
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinematch_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ml_models:
